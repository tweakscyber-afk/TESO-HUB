<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TESO HUB | Ultimate Interactive Music Discovery Platform</title>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- Spotify Web API -->
    <script src="https://cdn.jsdelivr.net/npm/spotify-api@1.0.0/dist/spotify-api.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
        
        /* Splash Screen */
        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a0a2a 0%, #000 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
        
        .splash-logo {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 2s linear infinite, float 3s ease-in-out infinite;
        }
        
        @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        
        .splash-text { font-size: 20px; letter-spacing: 8px; color: cyan; text-shadow: 0 0 20px cyan; margin-top: 20px; }
        .loading-bar { width: 300px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 40px; overflow: hidden; }
        .loading-bar::after { content: ''; display: block; width: 100%; height: 100%; background: linear-gradient(90deg, cyan, magenta); transform: translateX(-100%); animation: load 2.5s ease forwards; }
        @keyframes load { to { transform: translateX(0); } }
        
        /* Glass Effects */
        .glass-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .glass-panel:hover { border-color: rgba(0, 255, 255, 0.6); box-shadow: 0 0 25px rgba(0, 255, 255, 0.2); }
        
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .ui-layer * { pointer-events: auto; }
        
        /* Map Container */
        #mapContainer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            height: 300px;
            z-index: 50;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid cyan;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            opacity: 0.9;
            transition: all 0.3s ease;
        }
        
        #mapContainer:hover { opacity: 1; box-shadow: 0 0 50px rgba(0, 255, 255, 0.5); }
        
        #liveMap {
            width: 100%;
            height: 100%;
            background: #0a0a2a;
        }
        
        .leaflet-container { background: #0a0a2a !important; }
        .leaflet-tile { filter: hue-rotate(200deg) saturate(1.5) brightness(0.7); }
        
        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        
        @keyframes waveAnim {
            0%, 100% { height: 3px; }
            50% { height: 20px; }
        }
        
        .wave-bar { animation: waveAnim 0.8s ease-in-out infinite; }
        .pulse-ring { animation: pulse 2s ease-in-out infinite; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,255,255,0.1); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: cyan; border-radius: 5px; }
        
        /* Search Input */
        .search-input {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            border-color: cyan;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            outline: none;
        }
        
        /* Video Modal */
        .video-modal {
            animation: slideIn 0.3s ease;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
        }
        
        /* Floating Elements */
        .floating { animation: floatElement 3s ease-in-out infinite; }
        @keyframes floatElement { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        
        /* Recommendation Panel */
        .recommendation-badge {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            color: white;
            margin-left: 5px;
        }
        
        /* Stats Animation */
        .stat-counter {
            display: inline-block;
            font-weight: bold;
            color: cyan;
        }
    </style>
</head>
<body>

    <div class="loading-bar"></div>
    <div style="margin-top: 30px; font-size: 12px; color: rgba(255,255,255,0.5);">CONNECTING TO SPOTIFY • LOADING INTERACTIVE MAPS...</div>

<div id="mapContainer">

<div id="root"></div>

<script type="module">
    import * as THREE from 'three';

    // ============================================

    const SPOTIFY_CONFIG = {
        clientId: 'YOUR_SPOTIFY_CLIENT_ID', // Get from https://developer.spotify.com/dashboard
        redirectUri: window.location.origin,
        scopes: ['streaming', 'user-read-private', 'user-read-email']

    async function getSpotifyToken() {
        // Implement OAuth flow - simplified version
        const token = localStorage.getItem('spotify_token');
        if (token) return token;
        // Redirect to Spotify auth (implement full OAuth2 flow)
        console.log('Spotify token needed. Implement OAuth flow.');
        return null;
    }
    
    async function searchSpotifyTracks(query) {
        try {
            const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=5`, {
                headers: { 'Authorization': `Bearer ${await getSpotifyToken()}` }
            });
            return await response.json();
        } catch (e) {
            console.error('Spotify search error:', e);
            return null;
        }
    }
    
    // ============================================
    // REAL WORLD MUSIC HUBS - MAJOR MUSIC CITIES
    // ============================================
    
    const MUSIC_HUBS = [
        // Africa
        { id: 'dar', name: 'Dar es Salaam', country: 'Tanzania', lat: -6.7924, lon: 39.2083, genre: 'Bongo Flava', artists: ['Diamond Platnumz', 'Harmonize', 'Rayvanny'], color: '#FF00FF', spotifyId: 'artist' },
        { id: 'lagos', name: 'Lagos', country: 'Nigeria', lat: 6.5244, lon: 3.3792, genre: 'Afrobeats', artists: ['Burna Boy', 'Wizkid', 'Davido', 'Tiësto'], color: '#FFD700', spotifyId: 'artist' },
        { id: 'nairobi', name: 'Nairobi', country: 'Kenya', lat: -1.2864, lon: 36.8172, genre: 'Afro-Pop', artists: ['Sauti Sol', 'Khaligraph Jones', 'Nyashinski'], color: '#00BFFF', spotifyId: 'artist' },
        { id: 'kampala', name: 'Kampala', country: 'Uganda', lat: 0.3136, lon: 32.5811, genre: 'Afrobeats', artists: ['Eddy Kenzo', 'Sheebah', 'Spice Diana'], color: '#FF6B35', spotifyId: 'artist' },
        { id: 'accra', name: 'Accra', country: 'Ghana', lat: 5.6037, lon: -0.1870, genre: 'Hiplife', artists: ['Stonebwoy', 'Shatta Wale', 'Sarkodie'], color: '#00CED1', spotifyId: 'artist' },
        { id: 'joburg', name: 'Johannesburg', country: 'South Africa', lat: -26.2041, lon: 28.0473, genre: 'Amapiano', artists: ['Master KG', 'Kabza De Small', 'DJ Maphorisa'], color: '#FF69B4', spotifyId: 'artist' },
        
        // Global
        { id: 'nyc', name: 'New York', country: 'USA', lat: 40.7128, lon: -74.0060, genre: 'Hip-Hop', artists: ['The Weeknd', 'A Boogie', 'Don Toliver'], color: '#FF1493', spotifyId: 'artist' },
        { id: 'la', name: 'Los Angeles', country: 'USA', lat: 34.0522, lon: -118.2437, genre: 'Hip-Hop/Rap', artists: ['Kendrick Lamar', 'Ice Cube', 'YG'], color: '#FFD700', spotifyId: 'artist' },
        { id: 'london', name: 'London', country: 'UK', lat: 51.5074, lon: -0.1278, genre: 'Grime/Pop', artists: ['The 1975', 'Stormzy', 'Skepta'], color: '#00FFFF', spotifyId: 'artist' },
        { id: 'paris', name: 'Paris', country: 'France', lat: 48.8566, lon: 2.3522, genre: 'Electronic', artists: ['Daft Punk', 'Justice', 'The Chemical Brothers'], color: '#FF69B4', spotifyId: 'artist' },
        { id: 'tokyo', name: 'Tokyo', country: 'Japan', lat: 35.6762, lon: 139.6503, genre: 'J-Pop', artists: ['Yuki Kajiura', 'Perfume', 'Babymetal'], color: '#00BFFF', spotifyId: 'artist' },
        { id: 'seoul', name: 'Seoul', country: 'South Korea', lat: 37.5665, lon: 126.9780, genre: 'K-Pop', artists: ['BTS', 'BLACKPINK', 'Stray Kids'], color: '#FF00FF', spotifyId: 'artist' },
        { id: 'santander', name: 'San Juan', country: 'Puerto Rico', lat: 18.4655, lon: -66.1057, genre: 'Reggaeton', artists: ['Bad Bunny', 'J Balvin', 'Ozuna'], color: '#FF6B35', spotifyId: 'artist' },
        { id: 'berlin', name: 'Berlin', country: 'Germany', lat: 52.5200, lon: 13.4050, genre: 'Techno', artists: ['Paul Kalkbrenner', 'Ricardo Villalobos', 'Len Faki'], color: '#00FFD1', spotifyId: 'artist' },
        { id: 'melbourne', name: 'Melbourne', country: 'Australia', lat: -37.8136, lon: 144.9631, genre: 'Indie', artists: ['Tones and I', 'King Gizzard', 'Nick Cave'], color: '#FFD700', spotifyId: 'artist' },
    ];
    
    // ============================================
    // REAL ARTISTS DATABASE (Spotify Integration Ready)
    // ============================================
    
    const REAL_ARTISTS = [
        // Afrobeats Leaders
        { id: 'burna', name: 'Burna Boy', genre: 'Afrofusion', country: 'Nigeria', city: 'Lagos', image: 'https://i.scdn.co/image/ab6761610000e5eb0e67cd81ea11efc0a76b72b5', spotifyUri: 'spotify:artist:62m76IfJkzwB7zj4itkS3P', plays: '120M' },
        { id: 'wizkid', name: 'Wizkid', genre: 'Afrobeats', country: 'Nigeria', city: 'Lagos', image: 'https://i.scdn.co/image/ab67616100005174dc8fbad57dae4bb7c36a0eee', spotifyUri: 'spotify:artist:4V8LLVI2CY69S5kS0zL3d1', plays: '150M' },
        { id: 'davido', name: 'Davido', genre: 'Afropop', country: 'Nigeria', city: 'Lagos', image: 'https://i.scdn.co/image/ab6761610000e5ebf2f82f1c3b99bb5f2a2b82c9', spotifyUri: 'spotify:artist:3qbXV1kMIE0ybD0SEj9aXF', plays: '100M' },
        
        // East Africa
        { id: 'diamond', name: 'Diamond Platnumz', genre: 'Bongo Flava', country: 'Tanzania', city: 'Dar es Salaam', image: 'https://i.scdn.co/image/ab67616100005174a3e87cde6d5d2f17ad0d5b9e', spotifyUri: 'spotify:artist:36QJpDe2go2KrRy4WL8Y32', plays: '58M' },
        { id: 'sauti', name: 'Sauti Sol', genre: 'Afro-Pop', country: 'Kenya', city: 'Nairobi', image: 'https://i.scdn.co/image/ab67616100005174b8f5f15e6f60ab2b71bfb3c7', spotifyUri: 'spotify:artist:41uWikVOi1PAr7L45L5Sug', plays: '42M' },
        
        // Global Superstars
        { id: 'weekend', name: 'The Weeknd', genre: 'R&B/Pop', country: 'Canada', city: 'Toronto', image: 'https://i.scdn.co/image/ab6761610000e5eb08310e18ef5b613cb3346cc7', spotifyUri: 'spotify:artist:1Xyo4u8uTS1j2TZugSQIv7', plays: '400M' },
        { id: 'taylor', name: 'Taylor Swift', genre: 'Pop', country: 'USA', city: 'New York', image: 'https://i.scdn.co/image/ab6761610000e5ebe33a2165b3434b3d78239586', spotifyUri: 'spotify:artist:06HL4z0CvFAxyc27GXpf94', plays: '450M' },
        { id: 'bts', name: 'BTS', genre: 'K-Pop', country: 'South Korea', city: 'Seoul', image: 'https://i.scdn.co/image/ab6761610000e5eb2a9ec3d441be3d26bf15260d', spotifyUri: 'spotify:artist:3Nrfpe0tUJi4K4DffpMkZb', plays: '500M' },
        { id: 'badbunny', name: 'Bad Bunny', genre: 'Reggaeton', country: 'Puerto Rico', city: 'San Juan', image: 'https://i.scdn.co/image/ab6761610000e5eb0e3cc405d272de786b4890d1', spotifyUri: 'spotify:artist:4q3ewBCX7sLccySNlHCCN8', plays: '300M' },
        { id: 'kendrick', name: 'Kendrick Lamar', genre: 'Hip-Hop', country: 'USA', city: 'Los Angeles', image: 'https://i.scdn.co/image/ab6761610000e5eb3ad07416a8f34666ab4bfc7d', spotifyUri: 'spotify:artist:2YZyLoL8augyULVtHqAFvn', plays: '280M' },
    ];
    
    // ============================================
    // THREE.JS SETUP
    // ============================================
    
    let scene, camera, renderer, labelRenderer, controls;
    let earth, starsField, particleField;
    let markers = [];
    let animationFrameId;
    let currentAudio = null;
    let currentPanel = null;
    let currentVideoModal = null;
    let currentNowPlaying = null;
    let animTime = 0;
    let liveMap = null;
    
    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0003);
        
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;z-index:5;pointer-events:auto';
        document.body.appendChild(labelRenderer.domElement);
        
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.enableZoom = true;
        controls.zoomSpeed = 1;
        
        // Lighting
        const ambient = new THREE.AmbientLight(0x111122);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x00ffff, 0.4);
        backLight.position.set(0, 0, -5);
        scene.add(backLight);
        
        // Stars
        const starGeo = new THREE.BufferGeometry();
        const starCount = 4000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 2000;
            starPos[i*3+1] = (Math.random() - 0.5) * 1000;
            starPos[i*3+2] = (Math.random() - 0.5) * 800 - 200;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsField = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.5 }));
        scene.add(starsField);
        
        // Earth
        const earthGeo = new THREE.SphereGeometry(4, 128, 128);
        const earthMat = new THREE.MeshPhongMaterial({ color: 0x1a4d8c, emissive: 0x003366, shininess: 30, transparent: true, opacity: 0.88 });
        earth = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earth);
        
        // Wireframe
        const wireGeo = new THREE.SphereGeometry(4.02, 64, 64);
        const wireframe = new THREE.Mesh(wireGeo, new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.12 }));
        scene.add(wireframe);
        
        // Atmosphere
        const atmosGeo = new THREE.SphereGeometry(4.15, 64, 64);
        const atmosMat = new THREE.MeshPhongMaterial({ color: 0x00aaff, emissive: 0x004466, transparent: true, opacity: 0.18, side: THREE.BackSide });
        const atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
        scene.add(atmosphere);
        
        // Particles
        const particleCount = 2500;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 4.25 + Math.random() * 0.4;
            particlePos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            particlePos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            particlePos[i*3+2] = r * Math.cos(phi);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        particleField = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0x00ffff, size: 0.015, transparent: true, opacity: 0.4 }));
        scene.add(particleField);
    }
    
    function latLonToVector(lat, lon, radius) {
        const phi = (90 - lat) * Math.PI / 180;
        const theta = lon * Math.PI / 180;
        return new THREE.Vector3(radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
    }
    
    function createMarkers() {
        MUSIC_HUBS.forEach(hub => {
            const pos = latLonToVector(hub.lat, hub.lon, 4.08);
            
            // Glowing marker
            const markerMat = new THREE.MeshStandardMaterial({ color: hub.color, emissive: hub.color, emissiveIntensity: 0.6 });
            const markerMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), markerMat);
            markerMesh.position.copy(pos);
            scene.add(markerMesh);
            
            // Pulse ring
            const ringMat = new THREE.MeshBasicMaterial({ color: hub.color, transparent: true, opacity: 0.5, wireframe: true });
            const ring = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), ringMat);
            ring.position.copy(pos);
            scene.add(ring);
            
            // Label
            const div = document.createElement('div');
            div.style.cssText = `
                background: rgba(0,0,0,0.8);
                backdrop-filter: blur(10px);
                border: 1px solid ${hub.color};
                border-radius: 24px;
                padding: 6px 14px;
                color: white;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                white-space: nowrap;
                text-align: center;
                box-shadow: 0 0 10px rgba(0,0,0,0.5);
            `;
            div.innerHTML = `<i class="fas fa-map-marker-alt" style="color:${hub.color};margin-right:5px;"></i>${hub.name}<br><span style="font-size:9px;color:${hub.color}">${hub.artists.length} artists</span>`;
            
            div.onmouseenter = () => { div.style.transform = 'scale(1.05)'; div.style.borderColor = '#0ff'; div.style.boxShadow = '0 0 20px cyan'; };
            div.onmouseleave = () => { div.style.transform = 'scale(1)'; div.style.borderColor = hub.color; };
            div.onclick = (e) => { e.stopPropagation(); showHubArtists(hub); updateMapToHub(hub); };
            
            const label = new CSS2DObject(div);
            label.position.copy(pos);
            scene.add(label);
            
            markers.push({ mesh: markerMesh, ring, label, hub, baseY: pos.y, floatOffset: Math.random() * Math.PI * 2 });
        });
    }
    
    // ============================================
    // LIVE MAP INTEGRATION (Leaflet)
    // ============================================
    
    function initMap() {
        liveMap = L.map('liveMap').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19,
        }).addTo(liveMap);
        
        // Add markers to Leaflet map
        MUSIC_HUBS.forEach(hub => {
            const marker = L.circleMarker([hub.lat, hub.lon], {
                radius: 6,
                fillColor: hub.color,
                color: hub.color,
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0.7
            }).addTo(liveMap);
            
            marker.bindPopup(`
                <div style="text-align:center; color:white;">
                    <strong>${hub.name}</strong><br>
                    <span style="color:${hub.color};">${hub.genre}</span><br>
                    <small>${hub.country}</small><br>
                    <small style="color:cyan;">${hub.artists.length} Artists</small>
                </div>
            `);
        });
    }
    
    function updateMapToHub(hub) {
        if (liveMap) {
            liveMap.flyTo([hub.lat, hub.lon], 6, { duration: 1 });
        }
    }
    
    // ============================================
    // UI PANELS & SEARCH WITH REAL ARTISTS
    // ============================================
    
    function destroyPanel() { if (currentPanel) { currentPanel.remove(); currentPanel = null; } }
    function destroyVideoModal() { if (currentVideoModal) { currentVideoModal.remove(); currentVideoModal = null; } }
    function destroyNowPlaying() { if (currentNowPlaying) { currentNowPlaying.remove(); currentNowPlaying = null; } }
    function stopAudio() { if (currentAudio) { currentAudio.pause(); currentAudio = null; } }
    
    function showHubArtists(hub) {
        destroyPanel();
        destroyVideoModal();
        
        // Fly to location
        const targetPos = latLonToVector(hub.lat, hub.lon, 4.5);
        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const startTime = performance.now();
        
        function fly(t) {
            const elapsed = performance.now() - startTime;
            const progress = Math.min(1, elapsed / 800);
            const ease = 1 - Math.pow(1 - progress, 3);
            camera.position.lerpVectors(startPos, targetPos.clone().multiplyScalar(1.6), ease);
            controls.target.lerpVectors(startTarget, targetPos, ease);
            controls.update();
            if (progress < 1) requestAnimationFrame(fly);
            else { controls.autoRotate = false; setTimeout(() => { controls.autoRotate = true; }, 5000); }
        }

    // ============================================
    // ANIMATION LOOP
    // ============================================
    
    function animate() {
        animationFrameId = requestAnimationFrame(animate);
        animTime += 0.016;
        
        if (starsField) starsField.rotation.y += 0.0003;
        if (particleField) particleField.rotation.y += 0.001;
        
        markers.forEach((marker, idx) => {
            const floatY = Math.sin(animTime * 1.5 + marker.floatOffset) * 0.02;
            marker.mesh.position.y = marker.baseY + floatY;
            if (marker.ring) marker.ring.position.y = marker.baseY + floatY;
            if (marker.label) marker.label.position.y = marker.baseY + floatY;
            
            if (marker.ring) {
                const scale = 1 + Math.sin(animTime * 2.5 + idx) * 0.15;
                marker.ring.scale.set(scale, scale, scale);
            }
        });
        
        controls.update();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }
    
    // ============================================
    // CLEANUP & INIT
    // ============================================
    
    function cleanup() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        stopAudio();
        destroyPanel();
        destroyVideoModal();
        destroyNowPlaying();
    }

        init3D();

        createUI();

        console.log('🗺️ Interactive maps enabled | 🌍 Real-time location tracking');
    }
    
    window.addEventListener('resize', () => {
        if (camera) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer?.setSize(window.innerWidth, window.innerHeight);
            labelRenderer?.setSize(window.innerWidth, window.innerHeight);
        }
    });
    
    window.addEventListener('beforeunload', cleanup);
    init();
